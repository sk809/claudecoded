# One-click deploy on Render: New > Blueprint, pick this repo.
services:
  - type: web
    name: claudecodes
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/styles
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DB_PATH
        value: /var/data/claudecodes.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
